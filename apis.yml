description: 'Periscope was a consumer live video streaming application (pscp.tv) that let people broadcast
  and watch real-time video from their mobile devices, later operated by Twitter. The service was
  discontinued in March 2021 and the site (https://www.pscp.tv/) now serves only a farewell notice with
  archived past broadcasts; it publishes no API, developer portal, or documentation. This profile was
  surfaced as a portfolio-lead stub (backers: bessemer-venture-partners, gv, menlo-ventures) in the API
  Evangelist network. Enrichment confirms there is no active API surface to catalog.'
